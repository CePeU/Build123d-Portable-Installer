name: build-nsis

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-nsis-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NSIS and plugins
        shell: pwsh
        run: |
          choco install nsis 7zip -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Could not install build tools' }
          New-Item -ItemType Directory -Force .build-tools | Out-Null
          Invoke-WebRequest 'https://nsis.sourceforge.io/mediawiki/images/c/c9/Inetc.zip' -OutFile '.build-tools/Inetc.zip'
          Invoke-WebRequest 'https://nsis.sourceforge.io/mediawiki/images/5/5a/NSISunzU.zip' -OutFile '.build-tools/NSISunzU.zip'
          Invoke-WebRequest 'https://nsis.sourceforge.io/mediawiki/images/6/69/Nsis7z_19.00.7z' -OutFile '.build-tools/Nsis7z.7z'
          Expand-Archive -LiteralPath '.build-tools/Inetc.zip' -DestinationPath '.build-tools/inetc'
          Expand-Archive -LiteralPath '.build-tools/NSISunzU.zip' -DestinationPath '.build-tools/nsisunz'
          & "$env:ProgramFiles\7-Zip\7z.exe" x '-o.build-tools' '.build-tools/Nsis7z.7z'
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract Nsis7z' }
          $nsisRoot = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $pluginDestination = Join-Path $nsisRoot 'Plugins\x86-unicode'
          Copy-Item -LiteralPath '.build-tools/inetc/Plugins/x86-unicode/INetC.dll' -Destination $pluginDestination
          Copy-Item -LiteralPath '.build-tools/nsisunz/NSISunzU/Plugin unicode/nsisunz.dll' -Destination $pluginDestination
          Copy-Item -LiteralPath '.build-tools/Plugins/x86-unicode/nsis7z.dll' -Destination $pluginDestination

      - name: Check components and portable launchers
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          python tests/run_checks.py $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Installer checks failed' }

      - name: Create installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $compiler /V3 Build123dPortableSetup.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PortableBuild123dSetup.exe
          path: PortableBuild123dSetup.exe
          if-no-files-found: error

  draft-release:
    if: github.event_name != 'pull_request'
    needs: build-nsis-exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PortableBuild123dSetup.exe
      - name: Create draft release with installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_id) }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release view $env:RELEASE_TAG --json isDraft > release.json
          if ($LASTEXITCODE -eq 0) {
            $release = Get-Content release.json -Raw | ConvertFrom-Json
            if (-not $release.isDraft) { throw 'Refusing to replace assets in a published release' }
            gh release upload $env:RELEASE_TAG PortableBuild123dSetup.exe --clobber
          } else {
            gh release create $env:RELEASE_TAG PortableBuild123dSetup.exe --draft --target $env:RELEASE_COMMIT --title "Portable Build123d $env:RELEASE_TAG" --notes "Portable Build123d Windows installer."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload installer to draft release' }
